<!doctype html>
<html lang="zh-Hant" class="compact reader-login-locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var stored = localStorage.getItem("readbar.lang");
        var lang = q === "en" || q === "zh-Hant" ? q : stored === "en" ? "en" : "zh-Hant";
        if (q === "en" || q === "zh-Hant") localStorage.setItem("readbar.lang", q);
        document.documentElement.lang = lang;
        document.documentElement.classList.toggle("lang-en", lang === "en");
      } catch (e) {}
    })();
  </script>
  <title>Notes - Task List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --compact-height: 52px;
      --chrome-toolbar-height: 52px;
      --chrome-bg: #dee1e6;
      --chrome-toolbar-bg: #ffffff;
      --chrome-icon: #5f6368;
      --chrome-icon-disabled: #bdc1c6;
      --chrome-icon-hover-bg: rgba(60, 64, 67, 0.08);
      --chrome-omnibox-bg: #e8eaed;
      --chrome-omnibox-focus-bg: #ffffff;
      --chrome-address-text: #202124;
      --chrome-separator: #dadce0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --chrome-bg: #202124;
        --chrome-toolbar-bg: #202124;
        --chrome-icon: #9aa0a6;
        --chrome-icon-disabled: #5f6368;
        --chrome-icon-hover-bg: rgba(255, 255, 255, 0.08);
        --chrome-omnibox-bg: #303134;
        --chrome-omnibox-focus-bg: #303134;
        --chrome-address-text: #e8eaed;
        --chrome-separator: #3c4043;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--chrome-toolbar-bg);
    }

    body {
      color: #202124;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    .memo {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--chrome-toolbar-bg);
    }

    .chrome-shell {
      flex-shrink: 0;
      width: 100%;
      height: var(--compact-height);
      overflow: hidden;
      user-select: none;
    }

    .stealth-bg {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background-color: #ffffff;
      background-repeat: no-repeat;
      background-position: top center;
      background-size: 100% auto;
    }

    /* Main toolbar */
    .chrome-toolbar {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      height: var(--chrome-toolbar-height);
      padding: 0 4px 0 6px;
      background: var(--chrome-toolbar-bg);
      color: var(--chrome-icon);
    }

    .chrome-nav-group {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 2px;
      margin-right: 6px;
    }

    .chrome-nav {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--chrome-icon);
      cursor: pointer;
    }

    .chrome-nav svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .chrome-nav:hover,
    .chrome-nav:focus-visible {
      background: var(--chrome-icon-hover-bg);
      outline: none;
    }

    .chrome-omnibox {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      height: 44px;
      margin: 0 8px 0 0;
      padding: 0 14px;
      border-radius: 24px;
      background: var(--chrome-omnibox-bg);
      transition: background 120ms ease;
    }

    .chrome-omnibox:focus-within {
      background: var(--chrome-omnibox-focus-bg);
    }

    html.compact,
    html.compact body,
    html.compact .memo,
    html.compact .chrome-shell,
    html.compact .chrome-toolbar,
    html.compact .chrome-omnibox {
      box-shadow: none !important;
    }

    .chrome-lock {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      color: var(--chrome-icon);
    }

    .chrome-lock svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .chrome-url-scroll {
      flex: 1;
      min-width: 0;
      height: 44px;
      overflow: hidden;
    }

    .chrome-url-scroll.can-scroll {
      overflow-x: auto;
      scrollbar-width: none;
      cursor: ew-resize;
    }

    .chrome-url-scroll.can-scroll::-webkit-scrollbar {
      display: none;
    }

    .chrome-url {
      display: inline-block;
      color: var(--chrome-address-text);
      font-size: 13px;
      line-height: 44px;
      white-space: nowrap;
    }

    .chrome-progress {
      flex-shrink: 0;
      margin-left: 10px;
      padding-left: 10px;
      border-left: 1px solid var(--chrome-separator);
      color: var(--chrome-icon);
      font-size: 12px;
      line-height: 44px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chrome-progress:hover {
      color: var(--chrome-address-text);
    }

    .chrome-jump {
      flex-shrink: 0;
      width: 72px;
      height: 26px;
      margin-left: 8px;
      padding: 0 6px;
      border: 1px solid var(--chrome-separator);
      border-radius: 4px;
      outline: none;
      background: var(--chrome-toolbar-bg);
      color: var(--chrome-address-text);
      font-size: 12px;
      text-align: right;
    }

    .chrome-omnibox-actions {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 2px;
      margin-left: 6px;
    }

    .chrome-omnibox-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--chrome-icon);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
    }

    .chrome-omnibox-btn:hover,
    .chrome-omnibox-btn.active {
      background: var(--chrome-icon-hover-bg);
    }

    .chrome-omnibox-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .chrome-toolbar-actions {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 2px;
      margin-left: 4px;
    }

    .chrome-toolbar-sep {
      width: 1px;
      height: 20px;
      margin: 0 4px;
      background: var(--chrome-separator);
    }

    .chrome-profile {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #8e24aa;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
    }

    .chrome-profile:hover,
    .chrome-profile:focus-visible {
      filter: brightness(1.08);
      outline: none;
    }

    .chrome-menu-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: var(--chrome-icon);
      pointer-events: none;
    }

    .chrome-menu-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    html.reader-login-locked .memo {
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .reader-login-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.55);
      font-family: "Bricolage Grotesque", "Noto Sans TC", sans-serif;
      color: #0f172a;
    }

    html.reader-login-locked .reader-login-gate {
      display: flex !important;
    }

    .reader-login-card {
      width: min(420px, 100%);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
    }

    .reader-login-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 20px;
      background: #1d4ed8;
      color: #ffffff;
      font-weight: 600;
    }

    .reader-login-header-brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .reader-login-logo {
      display: flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: #ffffff;
      color: #1d4ed8;
      font-size: 12px;
    }

    .reader-login-body {
      padding: 24px 28px 28px;
    }

    .reader-login-kicker {
      margin: 0;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 500;
    }

    .reader-login-body h1 {
      margin: 8px 0 0;
      color: #0f172a;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }

    .reader-login-body > p {
      margin: 10px 0 0;
      color: #475569;
      font-size: 14px;
      line-height: 1.6;
      word-break: keep-all;
    }

    .reader-login-form {
      display: grid;
      gap: 16px;
      margin-top: 24px;
    }

    .reader-login-form[hidden] {
      display: none !important;
    }

    .reader-login-form label {
      display: block;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
      word-break: keep-all;
    }

    .reader-login-form input {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
      color: #0f172a;
      font: inherit;
      outline: none;
    }

    .reader-login-form input:focus {
      border-color: #60a5fa;
    }

    .reader-login-error {
      margin: 0;
      color: #b91c1c;
      font-size: 13px;
      line-height: 1.5;
      word-break: keep-all;
    }

    .reader-login-error[hidden] {
      display: none !important;
    }

    .reader-login-submit,
    .reader-login-secondary {
      display: inline-flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28);
    }

    .reader-login-submit:disabled,
    .reader-login-secondary:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .reader-login-secondary {
      background: #ffffff;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      box-shadow: none;
    }

    .reader-login-alt {
      margin: 4px 0 0;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .reader-login-alt a {
      color: #1d4ed8;
      font-weight: 600;
      text-decoration: none;
    }

    html.lang-en .reader-login-body h1,
    html.lang-en .reader-login-body > p,
    html.lang-en .reader-login-form label,
    html.lang-en .reader-login-error {
      word-break: normal;
      overflow-wrap: break-word;
    }
  </style>

        <span class="rb-device-notice-mark">Rb</span>
        Readbar
      </span>
      <div class="site-lang-switch" role="group" data-i18n-aria="lang.aria" aria-label="語言">
        <button type="button" class="site-lang-btn" data-set-lang="zh-Hant" aria-pressed="true">繁</button>
        <button type="button" class="site-lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <section class="rb-device-notice-card" role="status" aria-labelledby="readbarDeviceTitle">

          <span class="rb-device-notice-mark">Rb</span>

        <p class="rb-device-notice-kicker" data-i18n="reader.noticeKicker">Office desktop</p>

        <p data-i18n="reader.noticeP1">Readbar 專為辦公室電腦瀏覽器而設，讓閱讀融入工作畫面。手機或平板的螢幕與操作方式並不適用，因此無法在流動裝置開啟閱讀器。</p>
        <p data-i18n="reader.noticeP2">請改以電腦登入會員中心後再啟動。</p>
        <div class="rb-device-notice-actions">
          <a class="rb-device-notice-primary" href="index.html" data-i18n="reader.noticeHome">返回產品官網</a>

        </div>

  <div id="readerLoginGate" class="reader-login-gate" data-reader-login-gate role="dialog" aria-modal="true" aria-labelledby="readerLoginTitle">
    <section class="reader-login-card">
      <header class="reader-login-header">
        <span class="reader-login-header-brand">
          <span class="reader-login-logo">Rb</span>
          Readbar
        </span>
        <div class="site-lang-switch" role="group" data-i18n-aria="lang.aria" aria-label="語言">
          <button type="button" class="site-lang-btn" data-set-lang="zh-Hant" aria-pressed="true">繁</button>
          <button type="button" class="site-lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
      </header>
      <div class="reader-login-body">
        <p class="reader-login-kicker" data-i18n="reader.loginFreeKicker">Free Login</p>
        <h1 id="readerLoginTitle" data-i18n="reader.loginH1">登入後即可使用閱讀器</h1>
        <p data-i18n="reader.loginLead">請輸入 Clerk 會員電郵及密碼。免費會員可開啟此閱讀器；Pro 會員會轉去 Pro 閱讀器。</p>
        <form id="readerLoginForm" class="reader-login-form">
          <div data-reader-login-fields class="reader-login-form">
            <label>
              <span data-i18n="common.email">電郵</span>
              <input id="readerLoginEmail" name="email" type="email" required autocomplete="username" spellcheck="false">
            </label>
            <label>
              <span data-i18n="common.password">密碼</span>
              <input id="readerLoginPassword" name="password" type="password" required autocomplete="current-password">
            </label>
            <div id="clerk-captcha" class="clerk-captcha"></div>
            <button type="submit" class="reader-login-submit" data-i18n="reader.loginSubmit">登入</button>
          </div>
          <div data-reader-login-verify class="reader-login-form" hidden>
            <p data-i18n="login.verifyLead">請輸入寄到你電郵的驗證碼。</p>
            <label>
              <span data-i18n="login.code">驗證碼</span>
              <input data-reader-login-code name="code" type="text" inputmode="numeric" autocomplete="one-time-code">
            </label>
            <button data-reader-login-verify-btn type="button" class="reader-login-submit" data-i18n="login.verifySubmit">驗證並登入</button>
            <button data-reader-login-resend type="button" class="reader-login-secondary" data-i18n="login.resend">重發驗證碼</button>
          </div>
          <p data-reader-login-error class="reader-login-error" hidden></p>
        </form>
      </div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      if (document.documentElement.classList.contains("rb-device-blocked")) return;

      const STORAGE_KEY = "stealthMemoReader.free.v1";
      const BG_DB_NAME = "stealthMemoReader.bg.free.v1";
      const BG_DB_STORE = "backgrounds";
      const COMPACT_TOOLBAR_HEIGHT = 52;
      const BOSS_CHROME_URL = "https://chrome.google.com/webstore/detail/developer-tools";
      const STEALTH_BG_COUNT = 2;
      const USER_MANUAL = [
        "【Readbar 免費版使用說明】",
        "這是一個偽裝成 Chrome 工具列的隱蔽閱讀器。",
        "匯入文件：點 ★ 按鈕。",
        "免費版支援 .txt（UTF-8、Big5、GB18030）。",
        "中文以句號（。）、英文以句點（.）分段。",
        "下一句：按 →。",
        "上一句：按 ←。",
        "↻ 按鈕：切換下方偽裝網頁背景。",
        "B 按鈕：上傳自訂偽裝背景（最多 2 張）。",
        "網址列右側數字：顯示進度，點擊可跳轉。",
        "長句可用滑鼠滾輪手動捲動網址列。",
        "閱讀進度會自動儲存在本機瀏覽器。"
      ];

      const state = {
        sentences: [],
        index: 0,
        fileName: "",
        bossMode: false,
        manualMode: false,
        manualIndex: 0,
        translateTraditional: false,
        stealthBgIndex: 0
      };

      const chromeShell = document.getElementById("chromeShell");
      const chromeUrl = document.getElementById("chromeUrl");
      const chromeUrlScroll = document.getElementById("chromeUrlScroll");
      const chromeAddressWrap = document.getElementById("chromeAddressWrap");
      const chromeJumpInput = document.getElementById("chromeJumpInput");
      const chromeBack = document.getElementById("chromeBack");
      const chromeForward = document.getElementById("chromeForward");
      const chromeRefresh = document.getElementById("chromeRefresh");
      const chromeProgress = document.getElementById("chromeProgress");
      const chromeUpload = document.getElementById("chromeUpload");
      const stealthBg = document.getElementById("stealthBg");
      const fileInput = document.getElementById("fileInput");
      const bgInput = document.getElementById("bgInput");
      const chromeProfileBtn = document.getElementById("chromeProfileBtn");

      let customBackgroundUrls = [];
      let bgDbPromise = null;

      function getCurrentSentenceText() {
        if (state.manualMode) {
          return USER_MANUAL[state.manualIndex] || "Readbar user manual";
        }
        if (!state.sentences.length) {
          return "Ready to import document";
        }
        return toTraditional(state.sentences[state.index]);
      }

      function getProgressLabel() {
        if (state.manualMode) {
          const total = USER_MANUAL.length;
          const current = state.manualIndex + 1;
          const percent = Math.round(current / total * 100);
          return `${current}/${total} (${percent}%)`;
        }

        const total = state.sentences.length;
        if (!total) return "0/0 (0%)";

        const current = state.index + 1;
        const percent = Math.round(current / total * 100);
        return `${current}/${total} (${percent}%)`;
      }

      function updateChromeUrlDisplay(text) {
        chromeUrl.textContent = text;
        chromeUrl.title = text;
        chromeUrlScroll.classList.remove("can-scroll");
        chromeUrlScroll.scrollLeft = 0;

        if (!text) return;

        requestAnimationFrame(() => {
          const overflow = chromeUrl.scrollWidth - chromeUrlScroll.clientWidth;
          if (overflow <= 4) return;

          chromeUrlScroll.classList.add("can-scroll");
        });
      }

      function updateChromeToolbar() {
        if (state.bossMode) {
          updateChromeUrlDisplay(BOSS_CHROME_URL);
          chromeProgress.classList.add("hidden");
        } else {
          updateChromeUrlDisplay(getCurrentSentenceText());
          chromeProgress.textContent = getProgressLabel();
          chromeProgress.classList.remove("hidden");
        }

      }

      function isCompactPopupContext() {
        return window.name === "StealthMemoReader"
          || new URLSearchParams(window.location.search).get("popup") === "1";
      }

      function getCompactOuterSize() {
        return {
          width: window.screen.availWidth,
          height: window.screen.availHeight
        };
      }

      function applyCompactWindowFrame() {
        const { width, height } = getCompactOuterSize();

        try {
          window.moveTo(window.screen.availLeft, window.screen.availTop);
          window.resizeTo(width, height);
        } catch (error) {
          // 部分環境會封鎖 moveTo / resizeTo。
        }
      }

      function ensureCompactFullWidth() {
        applyCompactWindowFrame();
        window.setTimeout(applyCompactWindowFrame, 120);
        window.setTimeout(applyCompactWindowFrame, 320);
      }

      function openBgDb() {
        if (!bgDbPromise) {
          bgDbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(BG_DB_NAME, 1);
            request.onupgradeneeded = () => {
              request.result.createObjectStore(BG_DB_STORE);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          });
        }
        return bgDbPromise;
      }

      function revokeCustomBackgroundUrls() {
        customBackgroundUrls.forEach((url) => {
          if (url) URL.revokeObjectURL(url);
        });
        customBackgroundUrls = [];
      }

      function hasStealthBackground(index) {
        return Boolean(customBackgroundUrls[index]);
      }

      function hasAnyStealthBackground() {
        return customBackgroundUrls.some(Boolean);
      }

      function normalizeStealthBgIndex(index) {
        return ((index % STEALTH_BG_COUNT) + STEALTH_BG_COUNT) % STEALTH_BG_COUNT;
      }

      function resolveStealthBgIndex(preferredIndex = state.stealthBgIndex) {
        const start = normalizeStealthBgIndex(preferredIndex);
        for (let offset = 0; offset < STEALTH_BG_COUNT; offset += 1) {
          const index = (start + offset) % STEALTH_BG_COUNT;
          if (hasStealthBackground(index)) return index;
        }
        return 0;
      }

      async function loadCustomBackgrounds() {
        if (!window.indexedDB) return false;

        try {
          const db = await openBgDb();
          const blobs = await Promise.all(
            Array.from({ length: STEALTH_BG_COUNT }, (_, index) => new Promise((resolve) => {
              const tx = db.transaction(BG_DB_STORE, "readonly");
              const request = tx.objectStore(BG_DB_STORE).get(String(index));
              request.onsuccess = () => resolve(request.result || null);
              request.onerror = () => resolve(null);
            }))
          );

          revokeCustomBackgroundUrls();
          customBackgroundUrls = blobs.map((blob) => (
            blob instanceof Blob ? URL.createObjectURL(blob) : null
          ));
          return customBackgroundUrls.some(Boolean);
        } catch (error) {
          return false;
        }
      }

      async function saveCustomBackgrounds(files) {
        const db = await openBgDb();
        const tx = db.transaction(BG_DB_STORE, "readwrite");
        const store = tx.objectStore(BG_DB_STORE);

        files.forEach((file, index) => {
          if (index < STEALTH_BG_COUNT) {
            store.put(file, String(index));
          }
        });

        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });

        await loadCustomBackgrounds();
        state.stealthBgIndex = resolveStealthBgIndex(0);
        saveState();
        updateStealthBackground();
      }

      function getBackgroundSource(index) {
        return customBackgroundUrls[index] || null;
      }

      function getBackgroundLabel(index) {
        return `背景 ${index + 1}`;
      }

      function updateStealthBackground() {
        if (!hasAnyStealthBackground()) {
          stealthBg.style.backgroundImage = "none";
          chromeRefresh.title = "切換偽裝背景（尚未上傳）";
          chromeRefresh.setAttribute("aria-label", "切換偽裝背景（尚未上傳）");
          return;
        }

        state.stealthBgIndex = resolveStealthBgIndex(state.stealthBgIndex);
        const index = state.stealthBgIndex;
        const src = getBackgroundSource(index);
        const label = getBackgroundLabel(index);
        stealthBg.style.backgroundImage = src ? `url("${src}")` : "none";
        chromeRefresh.title = `切換偽裝背景（${label}，${index + 1}/${STEALTH_BG_COUNT}）`;
        chromeRefresh.setAttribute("aria-label", `切換偽裝背景（${label}）`);
      }

      function cycleStealthBackground() {
        let next = state.stealthBgIndex;
        for (let step = 0; step < STEALTH_BG_COUNT; step += 1) {
          next = (next + 1) % STEALTH_BG_COUNT;
          if (hasStealthBackground(next)) {
            state.stealthBgIndex = next;
            saveState();
            updateStealthBackground();
            return;
          }
        }
      }

      async function bootstrapWindow() {
        await loadCustomBackgrounds();
        render();
        updateStealthBackground();
      }

      function prevSentence() {
        moveBy(-1);
      }

      function nextSentence() {
        moveBy(1);
      }

      function openChromeJumpInput() {
        if (state.bossMode) return;
        const sentences = getActiveSentences();
        if (!sentences.length) return;

        chromeProgress.classList.add("hidden");
        chromeJumpInput.classList.remove("hidden");
        chromeJumpInput.max = String(sentences.length);
        chromeJumpInput.value = String(getActiveIndex() + 1);
        chromeJumpInput.focus();
        chromeJumpInput.select();
      }

      function closeChromeJumpInput() {
        chromeJumpInput.classList.add("hidden");
        chromeProgress.classList.remove("hidden");
      }

      function toTraditional(text) {
        return text;
      }

      function isMostlyChinese(text) {
        let cjk = 0;
        let total = 0;
        Array.from(text).forEach((ch) => {
          if (/\s/.test(ch)) return;
          total += 1;
          if (/[\u3400-\u9fff]/.test(ch)) cjk += 1;
        });
        return total > 0 && cjk / total >= 0.2;
      }

      function splitByDelimiter(text, delimiter) {
        const sentences = [];
        let current = "";
        Array.from(text).forEach((ch) => {
          current += ch;
          if (ch === delimiter) {
            const trimmed = current.trim();
            if (trimmed) sentences.push(trimmed);
            current = "";
          }
        });
        const rest = current.trim();
        if (rest) sentences.push(rest);
        return sentences;
      }

      // ===== 文字解析器：中文以句號（。）斷句，英文以句點（.）斷句 =====
      function parseText(text) {
        const normalized = text
          .replace(/^\uFEFF/, "")
          .replace(/\r\n?/g, "\n")
          .replace(/\u0000/g, "")
          .trim();

        if (!normalized) return [];

        const delimiter = isMostlyChinese(normalized) ? "。" : ".";
        return splitByDelimiter(normalized, delimiter);
      }

      // ===== 中文編碼處理：優先 UTF-8，偵測異常後嘗試 Big5 與 GB18030 =====
      function decodeText(arrayBuffer) {
        const candidates = [];
        const encodings = ["utf-8", "big5", "gb18030"];

        encodings.forEach((encoding) => {
          try {
            const decoded = new TextDecoder(encoding, { fatal: encoding === "utf-8" })
              .decode(arrayBuffer);
            candidates.push({
              encoding,
              text: decoded,
              score: getDecodedTextScore(decoded)
            });
          } catch (error) {
            // 瀏覽器不支援該編碼或內容不是合法 UTF-8 時，略過此候選。
          }
        });

        if (!candidates.length) {
          return {
            text: new TextDecoder("utf-8").decode(arrayBuffer),
            encoding: "utf-8",
            uncertain: true
          };
        }

        candidates.sort((a, b) => b.score - a.score);
        const best = candidates[0];
        const utf8 = candidates.find((candidate) => candidate.encoding === "utf-8");
        const selected = utf8 && utf8.score >= best.score - 2 ? utf8 : best;

        return {
          text: selected.text,
          encoding: selected.encoding,
          uncertain: selected.score < 0
        };
      }

      function getDecodedTextScore(text) {
        const replacementCount = (text.match(/\uFFFD/g) || []).length;
        const controlCount = (text.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g) || []).length;
        const readableCount = (text.match(/[\u3400-\u9FFF\uF900-\uFAFFa-zA-Z0-9，。！？；：「」『』、\s]/g) || []).length;
        const mojibakeCount = (text.match(/[ÃÂæçåäð]/g) || []).length;
        return readableCount / Math.max(text.length, 1) * 100
          - replacementCount * 30
          - controlCount * 10
          - mojibakeCount * 3;
      }

      // ===== LocalStorage 操作：以單一 JSON 儲存句子、索引與顯示設定，並捕捉容量超限 =====
      function saveState(options = {}) {
        const { showQuotaAlert = false } = options;
        const payload = {
          s: state.sentences,
          i: state.index,
          n: state.fileName,
          tr: state.translateTraditional,
          bg: state.stealthBgIndex
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          return true;
        } catch (error) {
          if (showQuotaAlert) {
            alert("文件過大，無法存入瀏覽器本地記憶。仍可在本次開啟期間閱讀，重新整理後內容將消失。");
          }
          return false;
        }
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Array.isArray(saved.s)) return;

          state.sentences = saved.s.filter((item) => typeof item === "string");
          state.index = clampIndex(Number(saved.i) || 0);
          state.fileName = typeof saved.n === "string" ? saved.n : "";
          state.translateTraditional = Boolean(saved.tr);
          if (Number.isFinite(saved.bg)) {
            state.stealthBgIndex = normalizeStealthBgIndex(Number(saved.bg) || 0);
          }
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // ===== 閱讀器畫面：依目前模式呈現內容、說明書或假待辦 =====
      function render() {
        updateChromeToolbar();
      }

      function clampIndex(index) {
        if (!state.sentences.length) return 0;
        return Math.min(Math.max(Math.trunc(index), 0), state.sentences.length - 1);
      }

      function clampManualIndex(index) {
        return Math.min(Math.max(Math.trunc(index), 0), USER_MANUAL.length - 1);
      }

      function getActiveSentences() {
        return state.manualMode ? USER_MANUAL : state.sentences;
      }

      function getActiveIndex() {
        return state.manualMode ? state.manualIndex : state.index;
      }

      function setActiveIndex(value) {
        if (state.manualMode) {
          state.manualIndex = value;
        } else {
          state.index = value;
        }
      }

      function moveBy(offset) {
        if (state.manualMode) {
          state.manualIndex = clampManualIndex(state.manualIndex + offset);
          state.bossMode = false;
          render();
          return;
        }

        if (!state.sentences.length) {
          render();
          return;
        }

        state.index = clampIndex(state.index + offset);
        state.bossMode = false;
        saveState();
        render();
      }

      function jumpTo(inputValue) {
        const sentences = getActiveSentences();
        if (!sentences.length) return;

        const requestedLine = Number.parseInt(inputValue, 10);
        const target = Number.isFinite(requestedLine) ? requestedLine - 1 : getActiveIndex();
        const clamped = state.manualMode
          ? clampManualIndex(target)
          : clampIndex(target);

        setActiveIndex(clamped);

        if (!state.manualMode) {
          saveState();
        }

        render();
      }

      function toggleManual() {
        state.manualMode = !state.manualMode;
        state.bossMode = false;
        state.manualIndex = 0;
        closeChromeJumpInput();
        render();
      }

      function applyImportedSentences(sentences, fileName) {
        state.sentences = sentences;
        state.index = 0;
        state.fileName = fileName;
        state.bossMode = false;
        state.manualMode = false;
        saveState({ showQuotaAlert: true });
        render();
      }

      // ===== 檔案讀取：免費版只支援 TXT =====
      async function importFile(file) {
        if (!file) return;

        const lowerName = file.name.toLowerCase();
        if (!lowerName.endsWith(".txt")) {
          alert("免費版只支援 .txt 文件。升級 Pro 即可匯入 EPUB。");
          fileInput.value = "";
          return;
        }

        try {
          const arrayBuffer = await file.arrayBuffer();
          const decoded = decodeText(arrayBuffer);
          const sentences = parseText(decoded.text);

          if (!sentences.length) {
            alert("文件中沒有可閱讀的文字。");
            return;
          }

          applyImportedSentences(sentences, file.name);

          if (decoded.uncertain) {
            alert("文件編碼無法完全確認。已嘗試 UTF-8、Big5 與 GB18030；若仍有亂碼，請先將文件另存為 UTF-8 後再匯入。");
          }
        } catch (error) {
          alert("讀取文件失敗，請確認文件未損壞。");
        } finally {
          fileInput.value = "";
        }
      }

      // ===== 事件監聽：匯入、背景切換、進度跳轉與鍵盤快捷鍵 =====
      fileInput.addEventListener("change", () => {
        importFile(fileInput.files[0]);
      });

      chromeBack.addEventListener("click", (event) => {
        event.stopPropagation();
        prevSentence();
      });

      chromeForward.addEventListener("click", (event) => {
        event.stopPropagation();
        nextSentence();
      });

      chromeRefresh.addEventListener("click", (event) => {
        event.stopPropagation();
        if (event.shiftKey) {
          bgInput.click();
          return;
        }
        cycleStealthBackground();
      });

      chromeProfileBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        bgInput.click();
      });

      bgInput.addEventListener("change", async () => {
        const files = Array.from(bgInput.files || []).filter((file) => file.type.startsWith("image/"));
        bgInput.value = "";

        if (!files.length) {
          alert("請選擇 PNG、JPG 或 WEBP 圖片。");
          return;
        }

        if (files.length < STEALTH_BG_COUNT) {
          const proceed = confirm(
            `你選了 ${files.length} 張圖，最多可儲存 ${STEALTH_BG_COUNT} 張。` +
            "圖片會按選取順序填入第 1 至第 " + files.length + " 格。仍要繼續？"
          );
          if (!proceed) return;
        }

        try {
          await saveCustomBackgrounds(files.slice(0, STEALTH_BG_COUNT));
          alert(`已儲存 ${Math.min(files.length, STEALTH_BG_COUNT)} 張自訂偽裝背景。`);
        } catch (error) {
          alert("儲存背景失敗，圖片可能太大或瀏覽器不支援 IndexedDB。");
        }
      });

      chromeProgress.addEventListener("click", (event) => {
        event.stopPropagation();
        openChromeJumpInput();
      });

      chromeUrlScroll.addEventListener("wheel", (event) => {
        if (!chromeUrlScroll.classList.contains("can-scroll")) return;
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        event.preventDefault();
        chromeUrlScroll.scrollLeft += event.deltaY;
      }, { passive: false });


      chromeUpload.addEventListener("click", (event) => {
        event.stopPropagation();
        fileInput.click();
      });

      chromeJumpInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          jumpTo(chromeJumpInput.value);
          closeChromeJumpInput();
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeChromeJumpInput();
        }
      });

      chromeJumpInput.addEventListener("blur", closeChromeJumpInput);

      document.addEventListener("keydown", (event) => {
        if (document.activeElement === chromeJumpInput) return;

        if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          event.preventDefault();
        }

        if (event.key === "?") {
          toggleManual();
          return;
        }

        if (event.key === "ArrowLeft") {
          prevSentence();
        } else if (event.key === "ArrowRight") {
          nextSentence();
        }
      });

      loadState();
      window.addEventListener("load", () => {
        bootstrapWindow();
      });
      window.addEventListener("resize", () => {
        if (isCompactPopupContext()) {
          applyCompactWindowFrame();
          if (state.bossMode) {
            updateChromeUrlDisplay(BOSS_CHROME_URL);
          } else {
            updateChromeUrlDisplay(getCurrentSentenceText());
          }
        }
      });
    })();
  </script>
</body>
</html>
