<!DOCTYPE html>
<html lang="zh-Hant" class="theme-light bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var stored = localStorage.getItem("readbar.lang");
        var lang = q === "en" || q === "zh-Hant" ? q : stored === "en" ? "en" : "zh-Hant";
        if (q === "en" || q === "zh-Hant") localStorage.setItem("readbar.lang", q);
        document.documentElement.lang = lang;
        document.documentElement.classList.toggle("lang-en", lang === "en");
      } catch (e) {}
    })();
  </script>
  <title data-i18n="meta.login.title">會員登入｜Readbar</title>
  <meta name="description" data-i18n-content="meta.login.description" content="登入 Readbar 會員中心。訪客須先登入，方可開啟閱讀器。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', '"Noto Sans TC"', "sans-serif"]
          },
          maxWidth: {
            content: "1120px"
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=19">
  <script src="js/i18n.js?v=20"></script>
</head>
<body class="theme-light min-h-screen bg-white font-sans text-slate-900 antialiased">
  <header class="bg-blue-700 text-white">
    <div class="mx-auto flex max-w-content items-center justify-between gap-3 px-5 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-semibold tracking-tight text-white">
        <img class="rb-lockup" src="images/logo-lockup-on-dark.svg" width="108" height="32" alt="Readbar">
      </a>
      <div class="site-page-header-actions">
        <div class="site-lang-switch" role="group" data-i18n-aria="lang.aria" aria-label="語言">
          <button type="button" class="site-lang-btn" data-set-lang="zh-Hant" aria-pressed="true">繁</button>
          <button type="button" class="site-lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <a href="index.html" class="text-sm text-blue-100 hover:text-white" data-i18n="nav.home">首頁</a>
      </div>
    </div>
  </header>

  <main class="hero-wash">
    <div class="mx-auto flex max-w-content flex-col gap-8 px-5 py-8 md:gap-10 md:py-20 lg:grid lg:grid-cols-[1.05fr_0.95fr] lg:items-start">
      <section class="min-w-0">
        <p class="text-sm font-medium text-blue-700" data-i18n="login.kicker">Member Login</p>
        <h1 class="mt-2 max-w-full text-xl font-bold tracking-tight text-slate-900 sm:text-3xl md:text-4xl" data-i18n="login.h1">登入後即可開啟閱讀器</h1>
        <p class="mt-4 max-w-full text-sm leading-7 text-slate-600 md:max-w-lg md:text-base" data-i18n="login.lead">
          訪客無法直接進入程式。登入後即可使用全部閱讀功能：TXT 與 EPUB、簡轉繁、20 張偽裝背景、獨立彈出視窗與偽裝網址鍵。
        </p>
        <ul class="mt-8 space-y-3 text-sm text-slate-700">
          <li class="flex min-w-0 items-start gap-3">
            <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-700">1</span>
            <span class="min-w-0 flex-1" data-i18n="login.point1">登入後進入會員中心，再啟動隱蔽閱讀器</span>
          </li>
          <li class="flex min-w-0 items-start gap-3">
            <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-700">2</span>
            <span class="min-w-0 flex-1" data-i18n="login.point2">全部功能均可使用，無需升級或付款</span>
          </li>
        </ul>
      </section>

      <section class="card-surface min-w-0 w-full rounded-3xl border border-slate-200 p-5 sm:p-8 md:p-10">
        <h2 class="text-xl font-bold tracking-tight text-slate-900" data-i18n="login.h2">登入會員中心</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600" data-i18n="login.formLead">請使用已註冊的電郵及密碼登入。</p>

        <form id="loginForm" class="mt-8 space-y-4">
          <div id="loginFields" class="space-y-4">
            <label class="block text-sm font-medium text-slate-700">
              <span data-i18n="common.email">電郵</span>
              <input id="loginEmail" name="email" type="email" required autocomplete="username" placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
            </label>
            <label class="block text-sm font-medium text-slate-700">
              <span data-i18n="common.password">密碼</span>
              <input id="loginPassword" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
            </label>
            <button type="submit" class="glow-btn mt-2 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500 disabled:opacity-60" data-i18n="login.submit">
              登入
            </button>
          </div>

          <div id="loginVerifyWrap" class="space-y-4 hidden">
            <p class="text-sm leading-6 text-slate-600" data-i18n="login.verifyLead">請輸入寄到你電郵的驗證碼。</p>
            <label class="block text-sm font-medium text-slate-700">
              <span data-i18n="login.code">驗證碼</span>
              <input id="loginVerifyCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" data-i18n-placeholder="login.codePlaceholder" placeholder="6 位數字" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
            </label>
            <button id="loginVerifyBtn" type="button" class="glow-btn mt-2 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500 disabled:opacity-60" data-i18n="login.verifySubmit">
              驗證並登入
            </button>
            <button id="loginResendBtn" type="button" class="inline-flex w-full items-center justify-center rounded-full border border-slate-300 px-5 py-3 text-sm font-medium text-slate-800 hover:border-blue-300 hover:text-blue-700 disabled:opacity-60" data-i18n="login.resend">
              重發驗證碼
            </button>
          </div>

          <p id="loginError" class="auth-form-error hidden" role="alert"></p>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          <span data-i18n="login.noAccount">還沒有帳號？</span>
          <a href="register.html" class="font-medium text-blue-700 hover:text-blue-800" data-i18n="login.registerLink">註冊</a>
        </p>
        <div class="mt-6 border-t border-slate-200 pt-5">
          <p class="text-center text-xs font-medium uppercase tracking-wide text-slate-400" data-i18n="login.preview">預覽會員中心</p>
          <div class="mt-3">
            <a id="previewDashboardLink" href="dashboard.html" class="inline-flex w-full items-center justify-center rounded-full border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-800 hover:border-blue-300 hover:text-blue-700" data-i18n="login.previewDash">預覽會員中心</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white px-5 py-8">
    <div class="mx-auto flex max-w-content flex-col items-center justify-between gap-4 text-sm text-slate-600 md:flex-row">
      <a href="index.html" class="hover:text-blue-700" data-i18n="footer.backHome">← 返回產品官網</a>
      <p>© 2026 Readbar. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/clerk-client.js?v=7"></script>
  <script src="js/auth.js?v=6"></script>
  <script src="js/login.js?v=6"></script>
</body>
</html>
