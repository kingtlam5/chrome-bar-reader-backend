<!DOCTYPE html>
<html lang="zh-Hant" class="theme-light bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>免費註冊｜Stealth Reader</title>
  <meta name="description" content="註冊 Stealth Reader 免費或 Pro 會員。填寫姓名、電郵、密碼並選擇方案。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', '"Noto Sans TC"', "sans-serif"]
          },
          maxWidth: {
            content: "1120px"
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-light min-h-screen bg-white font-sans text-slate-900 antialiased">
  <header class="bg-blue-700 text-white">
    <div class="mx-auto flex max-w-content items-center justify-between px-5 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-semibold tracking-tight text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm text-blue-700">SR</span>
        <span>Stealth Reader</span>
      </a>
      <a href="login.html" class="rounded-full bg-white px-4 py-2 text-sm font-medium text-blue-700 hover:bg-blue-50">登入</a>
    </div>
  </header>

  <main class="hero-wash">
    <div class="mx-auto grid max-w-content items-start gap-10 px-5 py-14 md:py-20 lg:grid-cols-[1.05fr_0.95fr]">
      <section>
        <p class="text-sm font-medium text-blue-700">Create Account</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900 md:text-4xl">註冊後就可以開始閱讀</h1>
        <p class="mt-4 max-w-lg text-sm leading-7 text-slate-600 md:text-base">
          填寫姓名、電郵同密碼，再揀免費或 Pro 方案。會員資料庫稍後接駁；而家先用示範掣完成流程。
        </p>
        <ul class="mt-8 space-y-3 text-sm text-slate-700">
          <li class="flex gap-3">
            <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-700">1</span>
            免費方案：註冊後進入免費會員中心
          </li>
          <li class="flex gap-3">
            <span class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs font-semibold text-blue-700">2</span>
            Pro 方案：$2.99／月，撳掣前往付款閘道
          </li>
        </ul>
      </section>

      <section class="card-surface w-full rounded-3xl border border-slate-200 p-8 md:p-10">
        <h2 class="text-xl font-bold tracking-tight text-slate-900">建立帳號</h2>
        <p class="mt-2 text-sm leading-6 text-slate-600">此為靜態示範，尚未連接會員資料庫或付款閘道。</p>

        <form id="registerForm" class="mt-8 space-y-4">
          <label class="block text-sm font-medium text-slate-700">
            姓名
            <input id="registerName" name="name" type="text" required autocomplete="name" placeholder="陳大文" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
          </label>
          <label class="block text-sm font-medium text-slate-700">
            電郵
            <input id="registerEmail" name="email" type="email" required autocomplete="email" placeholder="you@example.com" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
          </label>
          <label class="block text-sm font-medium text-slate-700">
            密碼
            <input id="registerPassword" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="最少 8 個字元" class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-900 outline-none focus:border-blue-400">
          </label>

          <fieldset class="pt-2">
            <legend class="text-sm font-medium text-slate-700">選擇方案</legend>
            <div class="mt-3 grid gap-3 sm:grid-cols-2" role="radiogroup" aria-label="選擇方案">
              <label class="plan-choice">
                <input type="radio" name="plan" value="free" checked>
                <span class="block text-xs font-medium text-slate-500">Free</span>
                <span class="mt-1 block text-lg font-bold text-slate-900">$0</span>
                <span class="mt-1 block text-xs leading-5 text-slate-600">TXT、2 張背景、本機進度</span>
              </label>
              <label class="plan-choice">
                <input type="radio" name="plan" value="pro">
                <span class="block text-xs font-medium text-slate-500">Pro</span>
                <span class="mt-1 block text-lg font-bold text-slate-900">$2.99<span class="text-sm font-medium text-slate-500">／月</span></span>
                <span class="mt-1 block text-xs leading-5 text-slate-600">EPUB、簡轉繁、Panic Button</span>
              </label>
            </div>
          </fieldset>

          <button id="registerFreeBtn" type="submit" class="glow-btn mt-2 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500">
            免費註冊
          </button>
          <button id="registerPayBtn" type="button" hidden class="glow-btn mt-2 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500">
            前往付款
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-600">
          已有帳號？
          <a href="login.html" class="font-medium text-blue-700 hover:text-blue-800">登入</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white px-5 py-8">
    <div class="mx-auto flex max-w-content flex-col items-center justify-between gap-4 text-sm text-slate-600 md:flex-row">
      <a href="index.html" class="hover:text-blue-700">← 返回產品官網</a>
      <p>© 2026 Stealth Reader. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
