<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Task List</title>
  <style>
    :root {
      --memo-bg: #fff3a8;
      --memo-bg-deep: #f4df7c;
      --memo-text: #3e3b2f;
      --muted-text: #77715b;
      --active-bg: rgba(255, 255, 255, 0.34);
      --memo-width: 350px;
      --memo-height: 250px;
      --compact-height: 30px;
      --title-height: 25px;
      --status-height: 24px;
      --font-size: 15px;
      --line-height: 1.72;
      --radius: 6px;
      --transition-speed: 180ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: var(--memo-width);
      height: var(--memo-height);
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--memo-bg);
    }

    html.compact,
    body.compact {
      height: var(--compact-height);
    }

    body {
      color: var(--memo-text);
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .memo {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: linear-gradient(145deg, var(--memo-bg), #ffef96);
      transition: height var(--transition-speed) ease;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--title-height);
      padding-left: 9px;
      border-bottom: 1px solid rgba(100, 84, 23, 0.13);
      background: var(--memo-bg-deep);
      color: #625c46;
      font-size: 11px;
      line-height: 1;
      user-select: none;
    }

    .title-actions {
      display: flex;
      height: 100%;
    }

    .title-btn {
      width: 31px;
      height: 100%;
      padding: 0;
      border: 0;
      border-left: 1px solid rgba(100, 84, 23, 0.12);
      background: transparent;
      color: #766d4d;
      cursor: pointer;
    }

    .title-btn:hover,
    .title-btn:focus-visible {
      background: rgba(255, 255, 255, 0.3);
      outline: none;
    }

    .title-btn.active {
      color: var(--memo-text);
      font-weight: 700;
    }

    .reader {
      height: calc(var(--memo-height) - var(--title-height) - var(--status-height));
      padding: 13px 16px 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      font-size: var(--font-size);
      line-height: var(--line-height);
      scrollbar-color: rgba(103, 94, 59, 0.35) transparent;
      scrollbar-width: thin;
    }

    .reader::-webkit-scrollbar {
      width: 5px;
    }

    .reader::-webkit-scrollbar-thumb {
      border-radius: 5px;
      background: rgba(103, 94, 59, 0.3);
    }

    .sentence {
      margin: 0 0 5px;
      padding: 0 3px;
      overflow-wrap: anywhere;
    }

    .sentence.current {
      border-radius: 3px;
      background: var(--active-bg);
    }

    .placeholder {
      margin: 48px 0 0;
      color: var(--muted-text);
      text-align: center;
      font-size: 13px;
    }

    .status-bar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--status-height);
      padding: 0 9px;
      border-top: 1px solid rgba(100, 84, 23, 0.11);
      background: rgba(244, 223, 124, 0.56);
      color: var(--muted-text);
      font-size: 10px;
      user-select: none;
    }

    .import-zone {
      cursor: default;
    }

    .progress-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 104px;
      height: 100%;
    }

    .progress {
      cursor: pointer;
    }

    .jump-input {
      width: 68px;
      height: 18px;
      padding: 1px 4px;
      border: 1px solid rgba(100, 84, 23, 0.25);
      border-radius: 2px;
      outline: none;
      background: rgba(255, 255, 255, 0.55);
      color: var(--memo-text);
      font-size: 10px;
      text-align: right;
    }

    .hidden {
      display: none !important;
    }

    .memo.compact {
      height: var(--compact-height);
    }

    .memo.compact .title-bar {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      width: 93px;
      height: var(--compact-height);
      padding: 0;
      border: 0;
      background: var(--memo-bg-deep);
    }

    .memo.compact .title-text,
    .memo.compact .status-bar {
      display: none;
    }

    .memo.compact .reader {
      width: calc(100% - 93px);
      height: var(--compact-height);
      padding: 4px 9px;
      overflow: hidden;
      font-size: 13px;
      line-height: 22px;
      white-space: nowrap;
    }

    .memo.compact .sentence {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      text-overflow: ellipsis;
    }

    .memo.compact .sentence:not(.current) {
      display: none;
    }

    .memo.compact .placeholder {
      margin: 0;
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="memo" id="memo" aria-label="隱蔽文字閱讀器">
    <header class="title-bar">
      <span class="title-text">Notes - Task List</span>
      <div class="title-actions">
        <button class="title-btn" id="helpBtn" type="button" aria-label="使用說明" title="使用說明">?</button>
        <button class="title-btn" id="resizeBtn" type="button" aria-label="縮放視窗至便利貼大小" title="縮放視窗至便利貼大小">⤢</button>
        <button class="title-btn" id="modeToggle" type="button" aria-label="切換單行模式" title="切換單行模式">−</button>
      </div>
    </header>

    <section class="reader" id="reader" aria-live="polite"></section>

    <footer class="status-bar" id="statusBar" title="雙擊以匯入 TXT 或 EPUB 文件">
      <span class="import-zone">Task notes</span>
      <div class="progress-wrap">
        <span class="progress" id="progress" title="點擊以跳轉">0/0 (0%)</span>
        <input
          class="jump-input hidden"
          id="jumpInput"
          type="number"
          min="1"
          inputmode="numeric"
          aria-label="跳轉至指定句"
        >
      </div>
    </footer>

    <input class="hidden" id="fileInput" type="file" accept=".txt,.epub,text/plain,application/epub+zip">
  </main>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "stealthMemoReader.v1";
      const MAX_SENTENCE_LENGTH = 30;
      const VISIBLE_SENTENCE_COUNT = 4;
      const FAKE_TASKS = [
        "1. Review API logs",
        "2. Update Jira ticket",
        "3. Reply emails"
      ];
      const USER_MANUAL = [
        "【Stealth Memo Reader 使用說明】",
        "這是一個偽裝成便利貼的隱蔽閱讀器。",
        "匯入文件：雙擊底部狀態列。",
        "支援 .txt 與 .epub 電子書格式。",
        "TXT 支援 UTF-8、Big5、GB18030 編碼。",
        "下一句：按 ↓ 或 → 方向鍵。",
        "上一句：按 ↑ 或 ← 方向鍵。",
        "老闆鍵：按空白鍵，切換假待辦清單。",
        "再按一次空白鍵可恢復閱讀內容。",
        "單行模式：點標題列 − 按鈕縮小。",
        "再按 + 可展開回便利貼模式。",
        "縮放視窗：點標題列 ⤢ 按鈕。",
        "若無法縮放，會自動以彈出視窗開啟。",
        "Memo 模式 350×250，單行模式 350×30。",
        "跳轉：點擊右下角進度數字。",
        "輸入行號後按 Enter 即可跳轉。",
        "閱讀進度會自動儲存在瀏覽器。",
        "重新整理後會從上次位置繼續閱讀。",
        "關閉說明：再點頂部 ? 按鈕即可。"
      ];

      const state = {
        sentences: [],
        index: 0,
        fileName: "",
        compact: false,
        bossMode: false,
        manualMode: false,
        manualIndex: 0
      };

      const memo = document.getElementById("memo");
      const reader = document.getElementById("reader");
      const statusBar = document.getElementById("statusBar");
      const progress = document.getElementById("progress");
      const jumpInput = document.getElementById("jumpInput");
      const fileInput = document.getElementById("fileInput");
      const modeToggle = document.getElementById("modeToggle");
      const resizeBtn = document.getElementById("resizeBtn");
      const helpBtn = document.getElementById("helpBtn");

      // ===== 視窗尺寸：一鍵縮放至便利貼大小；若瀏覽器封鎖則改以彈出視窗開啟 =====
      function getMemoWindowSize() {
        return {
          width: 350,
          height: state.compact ? 30 : 250
        };
      }

      function isLikelyPopupWindow() {
        return window.opener !== null || window.name === "StealthMemoReader";
      }

      function openMemoPopup(options = {}) {
        const { showBlockedAlert = false } = options;
        const { width, height } = getMemoWindowSize();
        const features = [
          `width=${width}`,
          `height=${height}`,
          "menubar=no",
          "toolbar=no",
          "location=no",
          "status=no",
          "resizable=yes",
          "scrollbars=no"
        ].join(",");

        const popup = window.open(location.href, "StealthMemoReader", features);
        if (!popup && showBlockedAlert) {
          alert("無法自動縮放視窗。請允許彈出視窗，或右鍵連結選擇「在新視窗中開啟」後手動調整大小。");
        }
        return Boolean(popup);
      }

      function fitWindowToMemo(options = {}) {
        const { showBlockedAlert = false } = options;
        const { width: memoWidth, height: memoHeight } = getMemoWindowSize();
        const chromeWidth = window.outerWidth - window.innerWidth;
        const chromeHeight = window.outerHeight - window.innerHeight;
        const targetWidth = memoWidth + chromeWidth;
        const targetHeight = memoHeight + chromeHeight;

        document.documentElement.classList.toggle("compact", state.compact);
        document.body.classList.toggle("compact", state.compact);

        const beforeWidth = window.outerWidth;
        const beforeHeight = window.outerHeight;

        try {
          window.resizeTo(targetWidth, targetHeight);
          window.moveTo(
            Math.max(0, Math.round((screen.availWidth - targetWidth) / 2)),
            Math.max(0, Math.round((screen.availHeight - targetHeight) / 2))
          );
        } catch (error) {
          return openMemoPopup(options);
        }

        // 現代瀏覽器在一般分頁會靜默忽略 resizeTo，需檢查是否真的有縮放成功。
        window.setTimeout(() => {
          const nearTarget = Math.abs(window.outerWidth - targetWidth) < 24
            && Math.abs(window.outerHeight - targetHeight) < 24;

          if (nearTarget) return;

          if (isLikelyPopupWindow()) {
            try {
              window.resizeTo(targetWidth, targetHeight);
            } catch (error) {
              // 已在彈出視窗但仍無法縮放時不再重複開窗。
            }
            return;
          }

          openMemoPopup({ showBlockedAlert });
        }, 120);

        return true;
      }

      // ===== 文字解析器：依中英文標點與換行切句，長句再以 30 字分段 =====
      function parseText(text) {
        const normalized = text
          .replace(/^\uFEFF/, "")
          .replace(/\r\n?/g, "\n")
          .replace(/\u0000/g, "")
          .trim();

        if (!normalized) return [];

        const rawSentences = normalized.match(/[^。！？!?\n]+[。！？!?]?|[。！？!?]+/g) || [];
        const parsed = [];

        rawSentences.forEach((rawSentence) => {
          const sentence = rawSentence.replace(/\s+/g, " ").trim();
          if (!sentence) return;

          const characters = Array.from(sentence);
          for (let start = 0; start < characters.length; start += MAX_SENTENCE_LENGTH) {
            parsed.push(characters.slice(start, start + MAX_SENTENCE_LENGTH).join(""));
          }
        });

        return parsed;
      }

      // ===== 中文編碼處理：優先 UTF-8，偵測異常後嘗試 Big5 與 GB18030 =====
      function decodeText(arrayBuffer) {
        const candidates = [];
        const encodings = ["utf-8", "big5", "gb18030"];

        encodings.forEach((encoding) => {
          try {
            const decoded = new TextDecoder(encoding, { fatal: encoding === "utf-8" })
              .decode(arrayBuffer);
            candidates.push({
              encoding,
              text: decoded,
              score: getDecodedTextScore(decoded)
            });
          } catch (error) {
            // 瀏覽器不支援該編碼或內容不是合法 UTF-8 時，略過此候選。
          }
        });

        if (!candidates.length) {
          return {
            text: new TextDecoder("utf-8").decode(arrayBuffer),
            encoding: "utf-8",
            uncertain: true
          };
        }

        candidates.sort((a, b) => b.score - a.score);
        const best = candidates[0];
        const utf8 = candidates.find((candidate) => candidate.encoding === "utf-8");
        const selected = utf8 && utf8.score >= best.score - 2 ? utf8 : best;

        return {
          text: selected.text,
          encoding: selected.encoding,
          uncertain: selected.score < 0
        };
      }

      function getDecodedTextScore(text) {
        const replacementCount = (text.match(/\uFFFD/g) || []).length;
        const controlCount = (text.match(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g) || []).length;
        const readableCount = (text.match(/[\u3400-\u9FFF\uF900-\uFAFFa-zA-Z0-9，。！？；：「」『』、\s]/g) || []).length;
        const mojibakeCount = (text.match(/[ÃÂæçåäð]/g) || []).length;
        return readableCount / Math.max(text.length, 1) * 100
          - replacementCount * 30
          - controlCount * 10
          - mojibakeCount * 3;
      }

      // ===== LocalStorage 操作：以單一 JSON 儲存句子、索引與顯示設定，並捕捉容量超限 =====
      function saveState(options = {}) {
        const { showQuotaAlert = false } = options;
        const payload = {
          s: state.sentences,
          i: state.index,
          n: state.fileName,
          c: state.compact
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          return true;
        } catch (error) {
          if (showQuotaAlert) {
            alert("文件過大，無法存入瀏覽器本地記憶。仍可在本次開啟期間閱讀，重新整理後內容將消失。");
          }
          return false;
        }
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Array.isArray(saved.s)) return;

          state.sentences = saved.s.filter((item) => typeof item === "string");
          state.index = clampIndex(Number(saved.i) || 0);
          state.fileName = typeof saved.n === "string" ? saved.n : "";
          state.compact = Boolean(saved.c);
        } catch (error) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      // ===== 閱讀器畫面：依目前模式呈現內容、說明書或假待辦 =====
      function render() {
        memo.classList.toggle("compact", state.compact);
        modeToggle.textContent = state.compact ? "+" : "−";
        modeToggle.setAttribute("aria-label", state.compact ? "展開 Memo 模式" : "切換單行模式");
        helpBtn.classList.toggle("active", state.manualMode);
        helpBtn.setAttribute("aria-label", state.manualMode ? "關閉說明" : "使用說明");
        helpBtn.title = state.manualMode ? "關閉說明" : "使用說明";
        document.documentElement.classList.toggle("compact", state.compact);
        document.body.classList.toggle("compact", state.compact);

        if (state.bossMode) {
          renderSentences(FAKE_TASKS, 0, false);
          progress.textContent = "3 tasks pending";
          return;
        }

        if (state.manualMode) {
          state.manualIndex = clampManualIndex(state.manualIndex);
          const visible = state.compact
            ? [USER_MANUAL[state.manualIndex]]
            : USER_MANUAL.slice(state.manualIndex, state.manualIndex + VISIBLE_SENTENCE_COUNT);

          renderSentences(visible, state.manualIndex, true);

          const current = state.manualIndex + 1;
          const total = USER_MANUAL.length;
          const percent = Math.round(current / total * 100);
          progress.textContent = `說明 ${current}/${total} (${percent}%)`;
          jumpInput.max = String(total);
          reader.scrollTop = 0;
          return;
        }

        const total = state.sentences.length;
        if (!total) {
          reader.innerHTML = '<p class="placeholder">雙擊底部匯入文件</p>';
          progress.textContent = "0/0 (0%)";
          return;
        }

        state.index = clampIndex(state.index);
        const visible = state.compact
          ? [state.sentences[state.index]]
          : state.sentences.slice(state.index, state.index + VISIBLE_SENTENCE_COUNT);

        renderSentences(visible, state.index, true);

        const current = state.index + 1;
        const percent = Math.round(current / total * 100);
        progress.textContent = `${current}/${total} (${percent}%)`;
        jumpInput.max = String(total);
        reader.scrollTop = 0;
      }

      function renderSentences(sentences, baseIndex, markCurrent) {
        reader.replaceChildren();

        sentences.forEach((sentence, offset) => {
          const paragraph = document.createElement("p");
          paragraph.className = "sentence";
          if (markCurrent && offset === 0) paragraph.classList.add("current");
          paragraph.dataset.index = String(baseIndex + offset);
          paragraph.textContent = sentence;
          reader.appendChild(paragraph);
        });
      }

      function clampIndex(index) {
        if (!state.sentences.length) return 0;
        return Math.min(Math.max(Math.trunc(index), 0), state.sentences.length - 1);
      }

      function clampManualIndex(index) {
        return Math.min(Math.max(Math.trunc(index), 0), USER_MANUAL.length - 1);
      }

      function getActiveSentences() {
        return state.manualMode ? USER_MANUAL : state.sentences;
      }

      function getActiveIndex() {
        return state.manualMode ? state.manualIndex : state.index;
      }

      function setActiveIndex(value) {
        if (state.manualMode) {
          state.manualIndex = value;
        } else {
          state.index = value;
        }
      }

      function moveBy(offset) {
        if (state.manualMode) {
          state.manualIndex = clampManualIndex(state.manualIndex + offset);
          state.bossMode = false;
          render();
          return;
        }

        if (!state.sentences.length) {
          render();
          return;
        }

        state.index = clampIndex(state.index + offset);
        state.bossMode = false;
        saveState();
        render();
      }

      function jumpTo(inputValue) {
        const sentences = getActiveSentences();
        if (!sentences.length) return;

        const requestedLine = Number.parseInt(inputValue, 10);
        const target = Number.isFinite(requestedLine) ? requestedLine - 1 : getActiveIndex();
        const clamped = state.manualMode
          ? clampManualIndex(target)
          : clampIndex(target);

        setActiveIndex(clamped);

        if (!state.manualMode) {
          saveState();
        }

        render();
      }

      function toggleManual() {
        state.manualMode = !state.manualMode;
        state.bossMode = false;
        state.manualIndex = 0;
        closeJumpInput();
        render();
      }

      // ===== EPUB 解析器：解壓 ZIP、讀取 spine 順序並抽取純文字 =====
      async function inflateZipEntry(data) {
        if (typeof DecompressionStream === "undefined") {
          throw new Error("UNSUPPORTED_DECOMPRESSION");
        }

        const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        const buffer = await new Response(stream).arrayBuffer();
        return new Uint8Array(buffer);
      }

      async function parseZipEntries(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        const files = new Map();
        let offset = 0;

        while (offset + 30 <= arrayBuffer.byteLength) {
          const signature = view.getUint32(offset, true);
          if (signature !== 0x04034b50) break;

          const compression = view.getUint16(offset + 8, true);
          const compressedSize = view.getUint32(offset + 18, true);
          const nameLength = view.getUint16(offset + 26, true);
          const extraLength = view.getUint16(offset + 28, true);
          const dataStart = offset + 30 + nameLength + extraLength;

          if (dataStart + compressedSize > arrayBuffer.byteLength) break;

          const name = new TextDecoder().decode(
            new Uint8Array(arrayBuffer, offset + 30, nameLength)
          );
          const compressedData = new Uint8Array(arrayBuffer, dataStart, compressedSize);

          let content;
          if (compression === 0) {
            content = compressedData;
          } else if (compression === 8) {
            content = await inflateZipEntry(compressedData);
          } else {
            throw new Error(`UNSUPPORTED_ZIP_METHOD_${compression}`);
          }

          files.set(name.replace(/\\/g, "/"), content);
          offset = dataStart + compressedSize;
        }

        if (!files.size) {
          throw new Error("EMPTY_ZIP");
        }

        return files;
      }

      function readZipText(files, path) {
        const normalized = path.replace(/\\/g, "/").replace(/^\/+/, "");
        const content = files.get(normalized);
        if (!content) {
          throw new Error(`MISSING_ZIP_ENTRY_${normalized}`);
        }
        return new TextDecoder("utf-8").decode(content);
      }

      function resolveZipPath(basePath, relativePath) {
        const baseParts = basePath.split("/").slice(0, -1);
        relativePath.split("/").forEach((part) => {
          if (!part || part === ".") return;
          if (part === "..") baseParts.pop();
          else baseParts.push(part);
        });
        return baseParts.join("/");
      }

      function getXmlAttr(tag, attrName) {
        const match = tag.match(new RegExp(`${attrName}\\s*=\\s*["']([^"']+)["']`, "i"));
        return match ? match[1] : "";
      }

      function htmlToPlainText(html) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        doc.querySelectorAll("script, style, nav, svg").forEach((node) => node.remove());
        return (doc.body?.textContent || "")
          .replace(/\u00a0/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      async function extractEpubText(arrayBuffer) {
        const files = await parseZipEntries(arrayBuffer);
        const containerXml = readZipText(files, "META-INF/container.xml");
        const rootFileMatch = containerXml.match(/<rootfile\b[^>]*>/i);
        if (!rootFileMatch) {
          throw new Error("MISSING_EPUB_ROOTFILE");
        }

        const opfPath = getXmlAttr(rootFileMatch[0], "full-path");
        if (!opfPath) {
          throw new Error("MISSING_EPUB_OPF");
        }

        const opfXml = readZipText(files, opfPath);
        const manifest = new Map();
        const manifestRegex = /<item\b[^>]*>/gi;
        let manifestMatch;

        while ((manifestMatch = manifestRegex.exec(opfXml)) !== null) {
          const tag = manifestMatch[0];
          const id = getXmlAttr(tag, "id");
          const href = getXmlAttr(tag, "href");
          const mediaType = getXmlAttr(tag, "media-type");
          if (id && href) {
            manifest.set(id, { href, mediaType });
          }
        }

        const spineIds = [];
        const spineRegex = /<itemref\b[^>]*>/gi;
        let spineMatch;

        while ((spineMatch = spineRegex.exec(opfXml)) !== null) {
          const idref = getXmlAttr(spineMatch[0], "idref");
          if (idref && manifest.has(idref)) {
            spineIds.push(idref);
          }
        }

        if (!spineIds.length) {
          throw new Error("EMPTY_EPUB_SPINE");
        }

        const textParts = [];
        spineIds.forEach((id) => {
          const item = manifest.get(id);
          const chapterPath = resolveZipPath(opfPath, item.href);
          const chapterHtml = readZipText(files, chapterPath);
          const plainText = htmlToPlainText(chapterHtml);
          if (plainText) textParts.push(plainText);
        });

        return textParts.join("\n\n");
      }

      function applyImportedSentences(sentences, fileName) {
        state.sentences = sentences;
        state.index = 0;
        state.fileName = fileName;
        state.bossMode = false;
        state.manualMode = false;
        saveState({ showQuotaAlert: true });
        render();
      }

      // ===== 檔案讀取：支援 TXT 與 EPUB，再進行編碼判斷與文字解析 =====
      async function importFile(file) {
        if (!file) return;

        const lowerName = file.name.toLowerCase();
        const isTxt = lowerName.endsWith(".txt");
        const isEpub = lowerName.endsWith(".epub");

        if (!isTxt && !isEpub) {
          alert("請選擇 .txt 或 .epub 文件。");
          return;
        }

        try {
          const arrayBuffer = await file.arrayBuffer();

          if (isEpub) {
            const epubText = await extractEpubText(arrayBuffer);
            const sentences = parseText(epubText);

            if (!sentences.length) {
              alert("EPUB 中沒有可閱讀的文字。");
              return;
            }

            applyImportedSentences(sentences, file.name);
            return;
          }

          const decoded = decodeText(arrayBuffer);
          const sentences = parseText(decoded.text);

          if (!sentences.length) {
            alert("文件中沒有可閱讀的文字。");
            return;
          }

          applyImportedSentences(sentences, file.name);

          if (decoded.uncertain) {
            alert("文件編碼無法完全確認。已嘗試 UTF-8、Big5 與 GB18030；若仍有亂碼，請先將文件另存為 UTF-8 後再匯入。");
          }
        } catch (error) {
          if (error.message === "UNSUPPORTED_DECOMPRESSION") {
            alert("此瀏覽器不支援 EPUB 解壓，請改用 Chrome 或 Edge。");
          } else {
            alert("讀取文件失敗，請確認文件未損壞。");
          }
        } finally {
          fileInput.value = "";
        }
      }

      // ===== 事件監聽：雙擊匯入、說明書、視窗縮放、進度跳轉、模式切換與鍵盤快捷鍵 =====
      statusBar.addEventListener("dblclick", (event) => {
        if (event.target === jumpInput || event.target.closest(".progress-wrap")) return;
        fileInput.click();
      });

      helpBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleManual();
      });

      resizeBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        fitWindowToMemo({ showBlockedAlert: true });
      });

      fileInput.addEventListener("change", () => {
        importFile(fileInput.files[0]);
      });

      modeToggle.addEventListener("click", () => {
        state.compact = !state.compact;
        saveState();
        render();
        fitWindowToMemo({ showBlockedAlert: true });
      });

      progress.addEventListener("click", () => {
        if (state.bossMode) return;
        if (!state.manualMode && !state.sentences.length) return;

        progress.classList.add("hidden");
        jumpInput.classList.remove("hidden");
        jumpInput.value = String(getActiveIndex() + 1);
        jumpInput.focus();
        jumpInput.select();
      });

      jumpInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          jumpTo(jumpInput.value);
          closeJumpInput();
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeJumpInput();
        }
      });

      jumpInput.addEventListener("blur", closeJumpInput);

      document.addEventListener("keydown", (event) => {
        if (document.activeElement === jumpInput) return;

        if (["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft", " "].includes(event.key)) {
          event.preventDefault();
        }

        if (event.key === "ArrowDown" || event.key === "ArrowRight") {
          moveBy(1);
        } else if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
          moveBy(-1);
        } else if (event.key === " ") {
          state.bossMode = !state.bossMode;
          render();
        }
      });

      function closeJumpInput() {
        jumpInput.classList.add("hidden");
        progress.classList.remove("hidden");
      }

      loadState();
      render();
      window.addEventListener("load", () => fitWindowToMemo());
    })();
  </script>
</body>
</html>
