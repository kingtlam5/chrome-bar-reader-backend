<!DOCTYPE html>
<html lang="zh-Hant" class="theme-light bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>付款｜Stealth Reader</title>
  <meta name="description" content="Stealth Reader Pro 付款閘道示範頁。尚未接駁真實付款服務。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', '"Noto Sans TC"', "sans-serif"]
          },
          maxWidth: {
            content: "1120px"
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-light min-h-screen bg-white font-sans text-slate-900 antialiased">
  <header class="bg-blue-700 text-white">
    <div class="mx-auto flex max-w-content items-center justify-between px-5 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-semibold tracking-tight text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm text-blue-700">SR</span>
        <span>Stealth Reader</span>
      </a>
      <a href="register.html" class="text-sm text-blue-100 hover:text-white">返回註冊</a>
    </div>
  </header>

  <main class="hero-wash">
    <div class="mx-auto max-w-lg px-5 py-14 md:py-20">
      <p class="text-sm font-medium text-blue-700">Payment Gateway</p>
      <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">確認 Pro 訂閱</h1>
      <p class="mt-3 text-sm leading-7 text-slate-600">此頁只係付款閘道參考頁。接駁 Stripe 或其他閘道之後，呢粒掣會帶客人去真實結帳。</p>

      <section class="card-surface mt-8 rounded-3xl border border-slate-200 p-8">
        <h2 class="text-lg font-semibold text-slate-900">訂單摘要</h2>
        <dl class="mt-5 space-y-3 text-sm">
          <div class="flex justify-between gap-4">
            <dt class="text-slate-500">方案</dt>
            <dd class="font-medium text-slate-900">Pro</dd>
          </div>
          <div class="flex justify-between gap-4">
            <dt class="text-slate-500">姓名</dt>
            <dd id="paymentName" class="font-medium text-slate-900">—</dd>
          </div>
          <div class="flex justify-between gap-4">
            <dt class="text-slate-500">電郵</dt>
            <dd id="paymentEmail" class="font-medium text-slate-900">—</dd>
          </div>
          <div class="flex justify-between gap-4 border-t border-slate-200 pt-3">
            <dt class="text-slate-500">每月</dt>
            <dd class="text-lg font-bold text-slate-900">$2.99</dd>
          </div>
        </dl>

        <button id="confirmPayBtn" type="button" class="glow-btn mt-8 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500">
          確認付款
        </button>
        <p id="paymentNote" class="mt-4 text-center text-sm leading-6 text-slate-500">
          付款閘道尚未接駁，呢粒掣暫時只作介面參考。
        </p>
        <p class="mt-6 text-center text-sm text-slate-600">
          <a href="register.html?plan=pro" class="font-medium text-blue-700 hover:text-blue-800">← 返回註冊</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white px-5 py-8">
    <div class="mx-auto flex max-w-content flex-col items-center justify-between gap-4 text-sm text-slate-600 md:flex-row">
      <a href="index.html" class="hover:text-blue-700">← 返回產品官網</a>
      <p>© 2026 Stealth Reader. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";
      const PENDING_KEY = "stealthReader.pendingSignup";
      const nameEl = document.getElementById("paymentName");
      const emailEl = document.getElementById("paymentEmail");
      const noteEl = document.getElementById("paymentNote");
      const payBtn = document.getElementById("confirmPayBtn");

      try {
        const raw = localStorage.getItem(PENDING_KEY);
        const pending = raw ? JSON.parse(raw) : null;
        if (pending?.name) nameEl.textContent = pending.name;
        if (pending?.email) emailEl.textContent = pending.email;
      } catch (error) {
        // Keep placeholders when no signup draft exists.
      }

      payBtn?.addEventListener("click", () => {
        // TODO: redirect to the connected payment gateway checkout session.
        if (noteEl) {
          noteEl.textContent = "付款閘道尚未接駁。接駁後，此掣會開啟真實結帳頁。";
          noteEl.classList.remove("text-slate-500");
          noteEl.classList.add("text-blue-700");
        }
      });
    })();
  </script>
</body>
</html>
