<!DOCTYPE html>
<html lang="zh-Hant" class="theme-light bg-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var stored = localStorage.getItem("readbar.lang");
        var lang = q === "en" || q === "zh-Hant" ? q : stored === "en" ? "en" : "zh-Hant";
        if (q === "en" || q === "zh-Hant") localStorage.setItem("readbar.lang", q);
        document.documentElement.lang = lang;
        document.documentElement.classList.toggle("lang-en", lang === "en");
      } catch (e) {}
    })();
  </script>
  <title data-i18n="meta.payment.title">付款｜Readbar</title>
  <meta name="description" data-i18n-content="meta.payment.description" content="Readbar Pro 付款閘道示範頁。尚未接駁真實付款服務。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8" }
          },
          fontFamily: {
            sans: ['"Bricolage Grotesque"', '"Noto Sans TC"', "sans-serif"]
          },
          maxWidth: {
            content: "1120px"
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <link rel="stylesheet" href="css/style.css?v=8">
  <script src="js/i18n.js?v=1"></script>
</head>
<body class="theme-light min-h-screen bg-white font-sans text-slate-900 antialiased">
  <header class="bg-blue-700 text-white">
    <div class="mx-auto flex max-w-content items-center justify-between gap-3 px-5 py-4">
      <a href="index.html" class="flex items-center gap-2.5 font-semibold tracking-tight text-white">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-white text-sm text-blue-700">Rb</span>
        <span>Readbar</span>
      </a>
      <div class="site-page-header-actions">
        <div class="site-lang-switch" role="group" data-i18n-aria="lang.aria" aria-label="語言">
          <button type="button" class="site-lang-btn" data-set-lang="zh-Hant" aria-pressed="true">繁</button>
          <button type="button" class="site-lang-btn" data-set-lang="en" aria-pressed="false">EN</button>
        </div>
        <a href="register.html" class="text-sm text-blue-100 hover:text-white" data-i18n="nav.backRegister">返回註冊</a>
      </div>
    </div>
  </header>

  <main class="hero-wash">
    <div class="mx-auto max-w-lg px-5 py-10 md:py-20">
      <p class="text-sm font-medium text-blue-700" data-i18n="payment.kicker">Payment Gateway</p>
      <h1 class="mt-2 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl" data-i18n="payment.h1">確認 Pro 訂閱</h1>
      <p class="mt-3 text-sm leading-7 text-slate-600" data-i18n="payment.lead">此頁僅為付款閘道參考頁。接駁 Stripe 或其他閘道之後，此按鈕將引導你前往真實結帳。</p>

      <section class="card-surface mt-8 min-w-0 rounded-3xl border border-slate-200 p-5 sm:p-8">
        <h2 class="text-lg font-semibold text-slate-900" data-i18n="payment.summary">訂單摘要</h2>
        <dl class="mt-5 space-y-3 text-sm">
          <div class="flex min-w-0 justify-between gap-4">
            <dt class="text-slate-500" data-i18n="common.plan">方案</dt>
            <dd class="min-w-0 font-medium text-slate-900">Pro</dd>
          </div>
          <div class="flex min-w-0 justify-between gap-4">
            <dt class="text-slate-500" data-i18n="common.name">姓名</dt>
            <dd id="paymentName" class="min-w-0 break-words font-medium text-slate-900">—</dd>
          </div>
          <div class="flex min-w-0 justify-between gap-4">
            <dt class="text-slate-500" data-i18n="common.email">電郵</dt>
            <dd id="paymentEmail" class="min-w-0 break-all font-medium text-slate-900">—</dd>
          </div>
          <div class="flex min-w-0 justify-between gap-4 border-t border-slate-200 pt-3">
            <dt class="text-slate-500" data-i18n="payment.monthly">每月</dt>
            <dd class="text-lg font-bold text-slate-900">$2.99</dd>
          </div>
        </dl>

        <button id="confirmPayBtn" type="button" class="glow-btn mt-8 inline-flex w-full items-center justify-center rounded-full bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-500" data-i18n="payment.confirm">
          確認付款
        </button>
        <p id="paymentNote" class="mt-4 text-center text-sm leading-6 text-slate-500" data-i18n="payment.note">
          付款閘道尚未接駁，此按鈕暫時只作介面參考。
        </p>
        <p class="mt-6 text-center text-sm text-slate-600">
          <a href="register.html?plan=pro" class="font-medium text-blue-700 hover:text-blue-800" data-i18n="payment.backRegister">← 返回註冊</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white px-5 py-8">
    <div class="mx-auto flex max-w-content flex-col items-center justify-between gap-4 text-sm text-slate-600 md:flex-row">
      <a href="index.html" class="hover:text-blue-700" data-i18n="footer.backHome">← 返回產品官網</a>
      <p>© 2026 Readbar. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (() => {
      "use strict";
      const PENDING_KEY = "stealthReader.pendingSignup";
      const nameEl = document.getElementById("paymentName");
      const emailEl = document.getElementById("paymentEmail");
      const noteEl = document.getElementById("paymentNote");
      const payBtn = document.getElementById("confirmPayBtn");

      try {
        const raw = localStorage.getItem(PENDING_KEY);
        const pending = raw ? JSON.parse(raw) : null;
        if (pending?.name) nameEl.textContent = pending.name;
        if (pending?.email) emailEl.textContent = pending.email;
      } catch (error) {
        // Keep placeholders when no signup draft exists.
      }

      payBtn?.addEventListener("click", () => {
        // TODO: redirect to the connected payment gateway checkout session.
        if (noteEl) {
          noteEl.setAttribute("data-i18n", "payment.noteClicked");
          noteEl.textContent = window.ReadbarI18n?.t("payment.noteClicked") || noteEl.textContent;
          noteEl.classList.remove("text-slate-500");
          noteEl.classList.add("text-blue-700");
        }
      });
    })();
  </script>
</body>
</html>
